server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: product-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/product_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
    table: flyway_schema_history

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      enable-idempotence: true

# Product cache configuration
product:
  cache:
    ttl-minutes: ${PRODUCT_CACHE_TTL_MINUTES:30} # Cache TTL in minutes

# Kafka topic configuration
kafka:
  topics:
    product-created: ${KAFKA_TOPIC_PRODUCT_CREATED:product-created}
    product-updated: ${KAFKA_TOPIC_PRODUCT_UPDATED:product-updated}
    product-deleted: ${KAFKA_TOPIC_PRODUCT_DELETED:product-deleted}
    inventory-decreased: ${KAFKA_TOPIC_INVENTORY_DECREASED:inventory-decreased}
