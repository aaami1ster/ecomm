  #   healthcheck:
  #     test:
  #       [
  #         "CMD-SHELL",
  #         "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1",
  #       ]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 40s
  #   networks:
  #     - ecomm-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ecomm-network:
    driver: bridge
