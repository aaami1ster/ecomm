version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ecomm-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecomm-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ecomm-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ecomm-network

  # Order Service
  order-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: order-service
    container_name: ecomm-order-service
    environment:
      # Server Configuration
      SERVER_PORT: 8082

      # Database Configuration
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      # Redis Configuration (if needed)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ecomm-network
    restart: unless-stopped

  # User Service
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: user-service
    container_name: ecomm-user-service
    environment:
      # Server Configuration
      SERVER_PORT: 8083

      # Database Configuration
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      # Redis Configuration (if needed)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ecomm-network
    restart: unless-stopped

  # Product Service
  product-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: product-service
    container_name: ecomm-product-service
    environment:
      # Server Configuration
      SERVER_PORT: 8081

      # Database Configuration
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/product_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      # Redis Configuration (if needed)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ecomm-network
    restart: unless-stopped

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: api-gateway
    container_name: ecomm-api-gateway
    environment:
      # Server Configuration
      SERVER_PORT: 8080

      # Service URLs (using container names and internal ports)
      SERVICES_PRODUCT_SERVICE_URL: http://product-service:8081
      SERVICES_ORDER_SERVICE_URL: http://order-service:8082
      SERVICES_USER_SERVICE_URL: http://user-service:8083
    ports:
      - "8080:8080"
    depends_on:
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ecomm-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ecomm-network:
    driver: bridge
